spring:
  application:
    name: gateway-service
  profiles:
    active: local
  cloud:
    nacos:
      server-addr: ${NACOS_HOST:192.168.209.128:8848}
      username: ${NACOS_USER:nacos}
      password: ${NACOS_PASS:nacos}
      config:
        file-extension: yaml
        shared-configs:
          - data-id: gateway-routes.yaml
            refresh: true
          - data-id: jwt-config.yaml